options:
  platform: n64
  basename: conker
  target_path: conker.us.bin
  base_path: .
  compiler: IDO
  hasm_in_src_path: True
  generated_c_preamble: |
    #include <ultra64.h>
    #include "structs.h"
  symbol_addrs_path:   symbol_addrs.us.txt

  auto_link_sections: []
  string_encoding: ASCII

  # asm_jtbl_label_macro: jlabel
  # asm_data_macro: dlabel

